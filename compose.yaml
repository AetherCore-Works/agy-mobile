services:
  agy-gateway:
    build: .
    container_name: agy-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ssh:/root/.ssh:ro
      - ./data:/data
    environment:
      - GATEWAY_MODE=${GATEWAY_MODE:-gateway}
      - DATA_DIR=${DATA_DIR:-/data}
      - TARGET_HOST=${TARGET_HOST:-192.0.2.10}
      - TARGET_USER=${TARGET_USER:-ai}
      - WOL_MAC=${WOL_MAC:-}
      - SSH_KEY=${SSH_KEY:-/root/.ssh/id_ed25519}
      - PORT=${PORT:-8088}
      - ENABLE_TELEMETRY=${ENABLE_TELEMETRY:-true}
      - ENABLE_TERMINAL=${ENABLE_TERMINAL:-true}
      - ENABLE_WATCHDOG=${ENABLE_WATCHDOG:-true}
      - ENABLE_WOL=${ENABLE_WOL:-true}
      - WHISPER_URL=${WHISPER_URL:-}
      - ENABLE_WHISPER=${ENABLE_WHISPER:-false}
      - ENABLE_COCKPIT=${ENABLE_COCKPIT:-false}
      - COCKPIT_URL=${COCKPIT_URL:-}
      - COCKPIT_TOKEN=${COCKPIT_TOKEN:-}
      - GATEWAY_AUTH_TOKEN=${GATEWAY_AUTH_TOKEN:-}
      - ENABLE_TELEGRAM_BOT=${ENABLE_TELEGRAM_BOT:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
      - TELEGRAM_MODE=${TELEGRAM_MODE:-polling}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}

  agy-ttyd:
    build:
      context: .
      dockerfile: Dockerfile.ttyd
    image: agy-ttyd:custom
    container_name: agy-ttyd
    restart: unless-stopped
    network_mode: host
    command: ["ttyd", "-p", "7681", "-b", "/terminal", "-W", "-t", "fontSize=14", "ssh", "-t", "-o", "StrictHostKeyChecking=accept-new", "${TTYD_SSH_TARGET:-user@192.0.2.10}", "exec ${TTYD_REMOTE_SHELL:-bash} -l"]

  agy-cockpit:
    profiles: ["cockpit"]
    build:
      context: ./packages/cockpit
      dockerfile: Dockerfile
    image: agy-cockpit:optional
    container_name: agy-cockpit
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - COCKPIT_ADDR=${COCKPIT_ADDR:-127.0.0.1:8099}
      - COCKPIT_ALLOW_POWER=${COCKPIT_ALLOW_POWER:-false}
      - COCKPIT_TOKEN=${COCKPIT_TOKEN:-}
