name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Cross-OS Binaries & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build multi-OS releases
        env:
          CGO_ENABLED: "0"
        run: |
          chmod +x ./scripts/build-releases.sh
          ./scripts/build-releases.sh
          (cd dist-releases && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-releases/*
          generate_release_notes: true
