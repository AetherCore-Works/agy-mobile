name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-go:
    name: Backend Go (Vet & Race Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Go Vet
        run: go vet ./...
      - name: Go Test (Race)
        run: go test -race -count=1 ./...

  packages-cockpit:
    name: Cockpit Package (Vet & Race Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/cockpit/go.mod
          cache-dependency-path: packages/cockpit/go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Go Vet
        run: go vet ./...
      - name: Go Test (Race)
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (Typecheck & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  secrets-scan:
    name: Secret & Hygiene Guard (Gitleaks CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI (OSS)
        run: |
          GITLEAKS_VER="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan current tree for secrets
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --no-banner'
      - name: Scan PR commit range for secrets
        if: github.event_name == 'pull_request'
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --no-banner'

  cross-build:
    name: Cross-OS Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [backend-go, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Build embedded frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build Go binary
        working-directory: backend-go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o /tmp/agy-gateway ./cmd/agy-gateway
